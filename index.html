<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Gigejob.com - Encuentra profesionales cerca de ti</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="google-adsense-account" content="ca-pub-8429350663913182">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8429350663913182" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; z-index: 9999;">
        <img src="/logo.png" alt="Cargando..." style="width: 110px; height: 110px; object-fit: contain; animation: pulse-heartbeat 1.4s ease-in-out infinite;" />
      </div>
    </div>
    <style>
      @keyframes pulse-heartbeat {
        0% { transform: scale(1); opacity: 0.9; }
        14% { transform: scale(1.15); opacity: 1; }
        28% { transform: scale(1); opacity: 0.9; }
        42% { transform: scale(1.12); opacity: 1; }
        70% { transform: scale(1); opacity: 0.9; }
        100% { transform: scale(1); opacity: 0.9; }
      }
    </style>
    <div id="google_translate_element"></div>
    <script type="text/javascript">
      (function() {
        if (document.cookie.indexOf('googtrans=') === -1) {
          var browserLang = (navigator.language || navigator.userLanguage).split('-')[0];
          var supportedLangs = ['es', 'en', 'fr', 'de', 'it'];
          var targetLang = supportedLangs.indexOf(browserLang) !== -1 ? browserLang : 'en'; // default to en if not supported or es
          if (targetLang !== 'es') {
            var expires = new Date();
            expires.setTime(expires.getTime() + (30 * 24 * 60 * 60 * 1000));
            document.cookie = 'googtrans=/es/' + targetLang + '; expires=' + expires.toUTCString() + '; path=/';
            document.cookie = 'googtrans=/es/' + targetLang + '; expires=' + expires.toUTCString() + '; domain=' + window.location.hostname + '; path=/';
          }
        }
      })();
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'es', includedLanguages: 'es,en,fr,de,it', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
